<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun.Win - Tài Xỉu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CỘT TRÁI -->
    <div class="left-sidebar">
        <div class="menu-icon" onclick="openHistory()" title="Lịch sử phiên">📊</div>
        <div class="menu-icon" onclick="alert('Tính năng Crypto đang bảo trì!')">₿</div>
        <div class="menu-icon" onclick="alert('Tính năng Idol đang cập nhật!')">👤</div>
        <div class="menu-icon" onclick="alert('Tải App để chơi mượt hơn!')">📱</div>
        <div class="menu-icon" onclick="alert('Cảnh báo bảo mật!')">⚠️</div>
    </div>

    <!-- CỘT GIỮA -->
    <div class="main-board">
        <div class="bet-controls-left">
            <div class="chip" onclick="selectChip(this, 1000)">1K</div>
            <div class="chip" onclick="selectChip(this, 10000)">10K</div>
            <div class="chip" onclick="selectChip(this, 50000)">50K</div>
            <div class="chip" onclick="selectChip(this, 100000)">100K</div>
            <div class="chip" onclick="selectChip(this, 500000)">500K</div>
            <div class="chip" onclick="selectChip(this, 5000000)">5M</div>
            <div class="chip" onclick="selectChip(this, 10000000)">10M</div>
            <div class="chip" onclick="selectChip(this, 50000000)">50M</div>
            <div class="chip btn-allin" onclick="allIn()">ALL-IN</div>
            <button class="btn-bet-main" onclick="showBetOptions()">ĐẶT CƯỢC</button>
            <button class="btn-cancel" onclick="cancelBet()">HỦY</button>
        </div>

        <div class="game-table-container">
            <div class="bet-panel tai" id="panelTai">
                <h2>TÀI</h2>
                <div class="bet-amount-box">
                    <div class="bet-amount" id="totalTai">0</div>
                    <div class="bet-players"><span id="playersTai">0</span> người</div>
                </div>
            </div>

            <div class="center-dice-container">
                <div class="session-code text-gold" style="position: absolute; top: -30px; right: 0; font-size: 14px;">Mã phiên: #<span id="sessionCodeDisplay">3305050</span></div>
                
                <div class="dice-circle" id="diceCircle">
                    <div class="timer-display" id="timer">35</div>
                    <div class="dice-area" id="diceArea">
                        <div class="dice" data-value="1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice" data-value="1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice" data-value="1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                </div>

                <div class="bowl-container" id="bowl">
                    <div class="bowl-cover" id="bowlCover" onmousedown="startDrag(event)" ontouchstart="startDrag(event)">KÉO ĐỂ MỞ</div>
                    <div class="bowl-dice-area">
                        <div class="dice" id="resD1" data-value="1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice" id="resD2" data-value="1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="dice" id="resD3" data-value="1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                </div>
            </div>

            <div class="bet-panel xiu" id="panelXiu">
                <h2>XỈU</h2>
                <div class="bet-amount-box">
                    <div class="bet-amount" id="totalXiu">0</div>
                    <div class="bet-players"><span id="playersXiu">0</span> người</div>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatBox">
            <div class="chat-header" onclick="toggleChat()"><span class="close-chat">✕</span></div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg"><span class="user">Hệ thống:</span> Chào mừng đến với Sun.Win!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Nhập nội dung chat..." onkeypress="handleChatEnter(event)">
                <button onclick="sendChat()">Gửi</button>
            </div>
        </div>
    </div>

    <!-- CỘT PHẢI -->
    <div class="right-sidebar">
        <div class="auth-box" id="authForm">
            <input type="text" id="usernameInput" placeholder="Tài khoản">
            <input type="password" id="passwordInput" placeholder="Mật khẩu">
            <button class="btn btn-primary" onclick="login()">ĐĂNG NHẬP</button>
            <button class="btn" style="background:transparent; border:1px solid var(--gold); color:var(--gold);" onclick="register()">ĐĂNG KÝ</button>
        </div>
        <div class="user-box" id="userBox">
            <div style="color: #fff;">👤 <span id="welcomeUser"></span></div>
            <div class="balance" id="userBalance">0 VNĐ</div>
            <button class="btn btn-deposit" onclick="deposit()">NẠP TIỀN</button>
            <button class="btn btn-logout" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>

    <!-- MODALS & TOAST -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <h3 style="color: var(--gold); margin-bottom: 10px;">NẠP TIỀN TỰ ĐỘNG</h3>
            <p>Mã đơn: <strong id="qrOrderCode" style="color: var(--red);"></strong></p>
            <img id="qrImage" src="" style="width: 250px; height: 250px; margin: 15px 0; border-radius: 10px; border: 2px solid var(--gold);">
            <button class="btn btn-logout" onclick="document.getElementById('qrModal').style.display='none'">ĐÓNG</button>
        </div>
    </div>

    <div class="modal" id="historyModal">
        <div class="modal-content" style="width: 90%; max-width: 600px;">
            <h3 style="color: var(--gold); margin-bottom: 10px;">LỊCH SỬ PHIÊN</h3>
            <table class="history-table">
                <thead><tr><th>Phiên</th><th>Xúc xắc</th><th>Tổng</th><th>Kết quả</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
            <button class="btn btn-logout" style="margin-top: 15px; width: 100%;" onclick="document.getElementById('historyModal').style.display='none'">ĐÓNG</button>
        </div>
    </div>

    <div class="toast" id="toastBox">
        <span id="toastText"></span>
        <span class="close-btn" onclick="document.getElementById('toastBox').style.display='none'">✕</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
