<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun.Win - Tài Xỉu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
        body { background-color: #0a0514; color: #fff; height: 100vh; display: flex; overflow: hidden; }
        
        /* Common CSS */
        .gold-border { border: 1px solid #d4af37; box-shadow: 0 0 5px rgba(212, 175, 55, 0.5); }
        .btn { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; text-align: center; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 10px currentColor; }
        
        /* Cột Trái */
        .left-sidebar { width: 70px; background: #150d21; border-right: 1px solid #3d2b50; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; z-index: 10; }
        .left-icon { width: 45px; height: 45px; background: #2a1a3a; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; border: 1px solid #d4af37; }
        
        /* Cột Giữa */
        .main-board { flex: 1; display: flex; flex-direction: column; padding: 20px; position: relative; }
        .header-title { text-align: center; font-size: 32px; font-weight: 800; color: #f9d976; text-shadow: 0 0 10px #d4af37; margin-bottom: 10px; font-style: italic;}
        .session-id { text-align: center; color: #a08b6b; font-size: 14px; margin-bottom: 20px; }
        
        .game-area { display: flex; justify-content: center; align-items: center; gap: 30px; flex: 1; }
        
        /* Khung Tài Xỉu */
        .bet-panel { width: 250px; height: 300px; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; border: 2px solid #d4af37; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .bet-panel.tai { background: linear-gradient(180deg, #4a1515, #1a0505); }
        .bet-panel.xiu { background: linear-gradient(180deg, #15304a, #050e1a); }
        .bet-panel h2 { font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 10px #fff; }
        .bet-amount { font-size: 24px; color: #f9d976; font-weight: bold; margin-bottom: 10px; }
        .bet-players { font-size: 14px; color: #aaa; }
        
        /* Vòng xúc xắc */
        .dice-circle { width: 220px; height: 220px; background: radial-gradient(circle, #2a1b38 0%, #0a0514 100%); border: 4px solid #d4af37; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 20px #000; z-index: 5; position: relative; }
        .timer { font-size: 60px; font-weight: 800; color: #f9d976; text-shadow: 0 0 15px #d4af37; line-height: 1; margin-bottom: 10px; }
        .dice-display { display: flex; gap: 15px; font-size: 40px; }
        .dice-display span { background: #fff; color: #000; width: 50px; height: 50px; border-radius: 10px; display: flex; justify-content: center; align-items: center; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        
        /* Thanh Đặt Cược */
        .bet-controls { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 20px; }
        .chip-row { display: flex; gap: 10px; }
        .chip { background: #1c1027; border: 1px solid #d4af37; color: #d4af37; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .chip.active, .chip:hover { background: #d4af37; color: #000; }
        .action-row { display: flex; gap: 20px; margin-top: 10px; }
        .btn-allin { background: #8e44ad; color: #fff; width: 80px; border-radius: 20px; }
        .btn-bet { background: linear-gradient(180deg, #f9d976, #b8860b); color: #000; font-size: 20px; padding: 15px 40px; border-radius: 30px; text-transform: uppercase; }
        .btn-cancel { background: linear-gradient(180deg, #e74c3c, #c0392b); color: #fff; padding: 15px 30px; border-radius: 30px; }

        /* Cột Phải */
        .right-sidebar { width: 300px; background: #150d21; border-left: 1px solid #3d2b50; padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .auth-box { display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group input { background: #0a0514; border: 1px solid #d4af37; color: #fff; padding: 12px; border-radius: 5px; outline: none; }
        .btn-login { background: linear-gradient(180deg, #f9d976, #b8860b); color: #000; }
        .btn-register { background: transparent; border: 1px solid #d4af37; color: #d4af37; }
        
        .user-box { display: none; flex-direction: column; gap: 15px; background: rgba(212, 175, 55, 0.1); padding: 15px; border-radius: 10px; border: 1px solid #d4af37; }
        .balance { font-size: 24px; color: #2ecc71; font-weight: bold; text-align: center; text-shadow: 0 0 10px #2ecc71; }
        .btn-deposit { background: #2ecc71; color: #fff; }
        .btn-logout { background: #e74c3c; color: #fff; }

        /* Chat Box */
        .chat-container { position: absolute; bottom: 0; left: 70px; right: 300px; background: rgba(10, 5, 20, 0.9); border-top: 1px solid #3d2b50; height: 150px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .chat-msg { color: #ccc; }
        .chat-msg .user { color: #f9d976; font-weight: bold; margin-right: 5px; }
        .chat-input-area { display: flex; padding: 10px; gap: 10px; background: #150d21; }
        .chat-input-area input { flex: 1; background: #0a0514; border: 1px solid #3d2b50; color: #fff; padding: 10px; border-radius: 5px; outline: none; }
        .chat-input-area button { background: #d4af37; color: #000; font-weight: bold; padding: 0 20px; border: none; border-radius: 5px; cursor: pointer; }

        /* Popup QR */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #150d21; padding: 30px; border: 2px solid #d4af37; border-radius: 10px; text-align: center; }
        .modal-content img { width: 250px; height: 250px; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- Cột Trái -->
    <div class="left-sidebar">
        <div class="left-icon">₿</div>
        <div class="left-icon">👤</div>
        <div class="left-icon">📱</div>
        <div class="left-icon">⚠️</div>
        <div class="left-icon">💬</div>
    </div>

    <!-- Cột Giữa (Game) -->
    <div class="main-board">
        <div class="header-title">TÀI XỈU</div>
        <div class="session-id">Mã phiên: <span id="sessionId">#3305050</span></div>

        <div class="game-area">
            <!-- Tài -->
            <div class="bet-panel tai gold-border">
                <h2>TÀI</h2>
                <div class="bet-amount" id="totalTai">0</div>
                <div class="bet-players"><span id="playersTai">0</span> người chơi</div>
            </div>

            <!-- Vòng Xúc Xắc -->
            <div class="dice-circle">
                <div class="timer" id="timer">35</div>
                <div class="dice-display" id="diceDisplay">
                    <span>🎲</span>
                    <span>🎲</span>
                    <span>🎲</span>
                </div>
            </div>

            <!-- Xỉu -->
            <div class="bet-panel xiu gold-border">
                <h2>XỈU</h2>
                <div class="bet-amount" id="totalXiu">0</div>
                <div class="bet-players"><span id="playersXiu">0</span> người chơi</div>
            </div>
        </div>

        <!-- Điều khiển cược -->
        <div class="bet-controls">
            <div class="chip-row">
                <div class="chip" onclick="addBet(1000)">1K</div>
                <div class="chip" onclick="addBet(10000)">10K</div>
                <div class="chip" onclick="addBet(50000)">50K</div>
                <div class="chip" onclick="addBet(100000)">100K</div>
                <div class="chip" onclick="addBet(500000)">500K</div>
            </div>
            <div class="action-row">
                <button class="btn btn-allin" onclick="allIn()">ALL-IN</button>
                <button class="btn btn-bet" onclick="placeBet('TAI')">ĐẶT CƯỢC (TÀI)</button>
                <button class="btn btn-bet" style="background: linear-gradient(180deg, #3498db, #2980b9); color:#fff;" onclick="placeBet('XIU')">ĐẶT CƯỢC (XỈU)</button>
                <button class="btn btn-cancel" onclick="cancelBet()">HỦY</button>
            </div>
            <div style="color: #f9d976; font-size: 18px; margin-top: 10px;">Tiền cược: <span id="currentBetDisplay">0</span></div>
        </div>

        <!-- Chat -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg"><span class="user">Hệ thống:</span> Chào mừng đến với Sun.Win!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Nhập nội dung chat..." onkeypress="handleChatEnter(event)">
                <button onclick="sendChat()">GỬI</button>
            </div>
        </div>
    </div>

    <!-- Cột Phải (User & Auth) -->
    <div class="right-sidebar">
        <!-- Form Đăng Nhập -->
        <div class="auth-box" id="authForm">
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Tài khoản">
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Mật khẩu">
            </div>
            <button class="btn btn-login" onclick="login()">ĐĂNG NHẬP</button>
            <button class="btn btn-register" onclick="register()">ĐĂNG KÝ</button>
        </div>

        <!-- Thông tin User -->
        <div class="user-box" id="userBox">
            <div style="text-align: center; font-size: 18px;" id="welcomeUser">Xin chào, User</div>
            <div class="balance" id="userBalance">$0</div>
            <button class="btn btn-deposit" onclick="deposit()">NẠP TIỀN</button>
            <button class="btn btn-logout" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>

    <!-- Modal QR -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <h3>NẠP TIỀN</h3>
            <p>Mã đơn: <strong id="qrOrderCode" style="color: #f9d976;"></strong></p>
            <img id="qrImage" src="" alt="QR Code">
            <p style="font-size: 12px; color: #aaa;">Quét mã để chuyển khoản. Tiền sẽ vào tài khoản tự động.</p>
            <button class="btn" style="margin-top: 15px; background: #e74c3c; color: #fff;" onclick="document.getElementById('qrModal').style.display='none'">ĐÓNG</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
